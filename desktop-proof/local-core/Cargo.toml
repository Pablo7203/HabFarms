[package]
name = "habfarms-desktop-local-proof"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
