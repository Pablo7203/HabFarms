[package]
name = "habfarms-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
habfarms-desktop-local = { path = "local-core" }
tauri = { version = "2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
