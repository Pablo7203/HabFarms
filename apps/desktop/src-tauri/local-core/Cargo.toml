[package]
name = "habfarms-desktop-local"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"
base64 = "0.22"
openssl = "0.10.81"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
